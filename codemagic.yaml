workflows:
  ios-app-store:
    name: iOS App Store Production
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "SebaHalt" # <--- ESTO ES LO QUE FALTA
    environment:
      flutter: stable
      xcode: latest
      groups:
        - app_store_credentials
      vars:
        XCODE_WORKSPACE: "Runner.xcworkspace" 
        XCODE_SCHEME: "Runner"
    scripts:
      - name: Flutter clean & get
        script: |
          flutter clean
          flutter pub get
      - name: Set up code signing settings on Xcode project
        script: |
          # 1. Configuramos el Team ID en el proyecto de Xcode
          xcode-project set-team-id --team-id T69RZR8Y5K
          
          # 2. Descargamos y preparamos los perfiles de Apple
          xcode-project use-profiles
      - name: Build iOS for Distribution
        script: |
          # Compilamos el IPA firmado
          flutter build ipa --release \
            --export-options-plist=$HOME/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration 
        submit_to_testflight: true
      email:
        recipients:
          - seba.muller@hotmail.cl
        notify:
          success: true
          failure: true
