workflows:
  ios_unsigned_ipa:
    name: iOS unsigned IPA
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: 15.2
      cocoapods: default
      vars:
        APP_NAME: "Runner"   # Nombre por defecto del .app generado
    scripts:
      - name: Flutter clean & get
        script: |
          flutter clean
          flutter pub get
      - name: Build iOS (no code signing)
        script: |
          # Compila el .app en modo release sin firmar
          flutter build ios --release --no-codesign

          # Empaqueta el .app dentro de un .ipa sin firma
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/${APP_NAME}.app build/ios/ipa/Payload/${APP_NAME}.app
          cd build/ios/ipa
          zip -r ${APP_NAME}.ipa Payload

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      email:
        recipients:
          - seba.muller@hotmail.cl
        notify:
          success: true
          failure: true
