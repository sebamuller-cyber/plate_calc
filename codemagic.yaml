workflows:
  ios-app-store:
    name: iOS App Store Production
    max_build_duration: 60
    instance_type: mac_mini_m2 # Usamos máquinas más rápidas de 2026
    environment:
      flutter: stable
      xcode: latest
      groups:
        - app_store_credentials # Aquí es donde Codemagic buscará tu API Key
      vars:
        XCODE_WORKSPACE: "Runner.xcworkspace" 
        XCODE_SCHEME: "Runner"
        APP_ID: 6762539314 # Reemplaza con el ID numérico que te dio Apple en App Store Connect
    scripts:
      - name: Flutter clean & get
        script: |
          flutter clean
          flutter pub get
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build iOS for Distribution
        script: |
          # Ahora sí compilamos para la tienda (IPA firmado)
          flutter build ipa --release \
            --export-options-plist=$HOME/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration # Usa la conexión que hiciste con la API Key
        submit_to_testflight: true
      email:
        recipients:
          - seba.muller@hotmail.cl
        notify:
          success: true
          failure: true
