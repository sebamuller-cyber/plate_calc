workflows:
  ios-app-store:
    name: iOS App Store Production
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: SebaHalt

    environment:
      flutter: stable

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.seba.haltercalc

    scripts:
      - name: Flutter clean & get
        script: |
          flutter clean
          flutter pub get

      - name: Build IPA (auto signing)
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
