workflows:
  ios-app-store-production:
    name: iOS App Store Production (Safe Mode)
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: app-store-connect

    environment:
      flutter: stable

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.seba.haltercalc

      vars:
        BUNDLE_ID: com.seba.haltercalc

    cache:
      cache_paths:
        - ~/.pub-cache
        - ios/Pods
        - ~/.gradle

    scripts:
      - name: Install dependencies
        script: |
          flutter pub get

      - name: Clean iOS build
        script: |
          flutter clean

      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..

      - name: Build IPA (SIGNED AUTOMATICALLY)
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
