workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest

      ios_signing:
        distribution_type: app-store-connect   # usa "ad_hoc" si quieres instalar en dispositivos
        bundle_identifier: com.seba.haltercalc

      vars:
        BUNDLE_ID: "com.seba.haltercalc"

    integrations:
      app_store_connect: Codemagic

    scripts:
      - name: Install dependencies
        script: |
          flutter pub get

      - name: Flutter build (no signing)
        script: |
          flutter build ios --release --no-codesign

      - name: Code signing (automatic)
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive archive

          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist $HOME/export_options.plist \
            -exportPath build/ios/ipa

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
